[workspace]
authors = ["Akhil <akhil.sathuluri@tum.de>"]
channels = ["conda-forge"]
name = "sim_a_splat"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
plotly = ">=6.1.2"
matplotlib = ">=3.10.3"
urchin = ">=0.0.29"
pygame = ">=2.6.1"
pymunk = ">=7.0.1"
pip = ">=25.1.1"
meshio = ">=5.3.5"
gymnasium = ">=1.0.0"
ipykernel = ">=7.2.0"
zarr = ">=3.0.8"
libxcrypt = ">=4.4.36"
narwhals = ">=1.43.0"
pkg-config = ">=0.29.2"
ffmpeg = ">=7.0"
open3d = ">=0.18"

[pypi-dependencies]
nerfstudio = { git = "git+https://github.com/akhilsathuluri/nerfstudio.git" }
amo-urdf = { git = "git+https://github.com/ami-iit/amo_urdf.git" }
sak = { git = "git+https://github.com/akhilsathuluri/sak.git" }
torch = ">=2.7.1"
torchvision = ">=0.22.1"
drake = "*"
plyfile = "*"

[system-requirements]
libc = "2.35"
cuda = "12"
